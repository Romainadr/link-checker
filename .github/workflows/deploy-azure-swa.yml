# Empirys MailWatch : publication sur Azure Static Web Apps (plan Free)
# Ne publie que les fichiers servis a Outlook (src/, clients/, icones).
# Docs, outils et manifests ne sont jamais mis en ligne.
name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-swa
  cancel-in-progress: false

jobs:
  deploy:
    # Garde-fou : ne tourne que sur le repo de l'org, jamais sur l'ancien repo perso
    if: github.repository == 'empirys/mailwatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer le site (fichiers runtime uniquement)
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/clients
          cp src/taskpane.html src/commands.html src/core.js _site/src/
          find clients -maxdepth 1 -name '*.json' ! -name '_*' -exec cp {} _site/clients/ \;
          cp icon-*.png _site/
          cp staticwebapp.config.json _site/
          echo "Contenu publie :"
          find _site -type f | sort

      - name: Deployer sur Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
